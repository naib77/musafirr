       these a shared link renders as a bare URL with no image, which for a
       marketplace is the most public surface the brand has.

       og:image must be an ABSOLUTE url — scrapers do not resolve relative
       paths — so the origin is repeated here from lib/config/legal_links.dart.
       If the deploy origin ever moves, both change together. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Musaafir">

  <!-- Favicon. Two sizes on purpose: flutter_launcher_icons only emits
       favicon.png at 16x16, and a hi-DPI tab renders the icon at 32px or more
       physical, so a lone 16px source is upscaled and the mark's thin strokes
       turn to mush. Browsers pick the closest size, so declaring the 192 lets
       them downscale a good source instead; the 16 stays as the fallback. -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=3120d2e9"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=4394cb0c"/>

  <title>Musaafir</title>
  <link rel="manifest" href="manifest.json">

  <!-- WebGL context-loss recovery.
       Flutter web (CanvasKit) renders through a WebGL context. On mobile
       Chrome/Safari, backgrounding the tab lets the browser discard the GPU
       context to reclaim memory; on return the canvas stays BLACK because the
       lost context is never repainted. CanvasKit renders via an OffscreenCanvas
       whose context-loss events never reach the DOM, so we patch getContext
       (BEFORE the engine boots) to attach the loss listener to the REAL context.
       We then ask the browser for a restore and only reload as a fallback, once
       the user is back and the context is verifiably still lost — a reload
       costs a full cold start, so it must not be the routine outcome.
       Append ?gldebug=1 to the URL to see an on-screen event log on a device. -->
  <script>
    (function () {
      var DEBUG = location.search.indexOf('gldebug') !== -1;
      var panel;
      function log(msg) {
        try { console.warn('[webgl-recovery] ' + msg); } catch (e) {}
        if (!DEBUG) return;
        if (!panel) {
          panel = document.createElement('pre');
          panel.style.cssText = 'position:fixed;left:0;bottom:0;right:0;z-index:2147483647;' +
            'max-height:45%;overflow:auto;margin:0;padding:6px 8px;background:rgba(0,0,0,.82);' +
            'color:#31d158;font:11px/1.35 monospace;white-space:pre-wrap;pointer-events:none';
          (document.body || document.documentElement).appendChild(panel);
        }
        var t = (performance.now() / 1000).toFixed(1);
        panel.textContent += t + 's  ' + msg + '\n';
        panel.scrollTop = panel.scrollHeight;
      }

      function whenVisible(fn) {
        if (document.visibilityState === 'visible') { fn(); return; }
        document.addEventListener('visibilitychange', function once() {
          if (document.visibilityState !== 'visible') return;
          document.removeEventListener('visibilitychange', once);
          fn();
        });
      }

      // Reloading is the LAST resort, not the first response. Backgrounding a
      // tab is by far the most common way to lose the context, and the browser
      // normally hands it straight back — reloading anyway turned every tab
      // switch into a cold start (splash, blank feed, lost scroll, full
      // refetch). So: ask for a restore, wait until the user is actually back,
      // give the engine a moment to repaint, and reload only if the context is
      // STILL lost at that point.
      var armed = false;
      var graceTimer = null;

      function cancel(reason) {
        if (!armed) return;
        armed = false;
        clearTimeout(graceTimer);
        graceTimer = null;
        log('recovery cancelled (' + reason + ')');
      }

      function recover(reason, ctx, grace) {
        if (armed) return;
        armed = true;
        log('ARMED (' + reason + ')');
        whenVisible(function () {
          if (!armed) return; // restored while the tab was in the background
          graceTimer = setTimeout(function () {
            if (!armed) return;
            var lost = true;
            try { lost = !ctx || ctx.isContextLost(); } catch (e) {}
            if (!lost) { cancel('context healthy on return'); return; }
            log('RELOADING (' + reason + ')');
            location.reload();
          }, grace);
        });
      }

      function watch(canvas, ctx, label) {
        if (!canvas || canvas.__glWatched) return;
        canvas.__glWatched = true;
        try {
          canvas.addEventListener('webglcontextlost', function (e) {
            // Required by the WebGL spec: without preventDefault() the browser
            // never attempts a restore, so an ordinary background eviction
            // could only ever end in a reload.
            e.preventDefault();
            log('CONTEXT LOST (' + label + ')');
            // A short grace lets a genuine restore paint first.
            recover('contextlost', ctx, 1200);
          });
          canvas.addEventListener('webglcontextrestored', function () {
            log('CONTEXT RESTORED (' + label + ')');
            cancel('webglcontextrestored');
            // Nudge the engine into repainting the restored surface — without a
            // layout change it can sit on the frame it held when the context died.
            try { window.dispatchEvent(new Event('resize')); } catch (e) {}
          });
        } catch (e) { log('watch error: ' + e.message); }
      }

      // Patch getContext so we catch the WebGL context CanvasKit creates —
      // including the OffscreenCanvas one, whose events never reach the DOM.
      function patch(proto, label) {
        if (!proto || !proto.getContext || proto.__glPatched) return;
        proto.__glPatched = true;
        var orig = proto.getContext;
        proto.getContext = function (type) {
          var ctx = orig.apply(this, arguments);
          if (ctx && (type === 'webgl' || type === 'webgl2')) watch(this, ctx, label + ':' + type);
          return ctx;
        };
      }
      patch(window.HTMLCanvasElement && HTMLCanvasElement.prototype, 'canvas');
      patch(window.OffscreenCanvas && OffscreenCanvas.prototype, 'offscreen');

      if (DEBUG) {
        log('gldebug on');
        log(navigator.userAgent);
        var hiddenAt = 0;
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') { hiddenAt = performance.now(); log('HIDDEN'); }
          else log('VISIBLE (was hidden ' + Math.round(performance.now() - hiddenAt) + 'ms)');
        });
        window.addEventListener('pagehide', function (e) { log('pagehide persisted=' + e.persisted); });
        window.addEventListener('pageshow', function (e) { log('pageshow persisted=' + e.persisted); });
        window.addEventListener('flutter-first-frame', function () { log('flutter-first-frame'); });
      }
    })();
  </script>

  <!-- PWA install bridge.
       Chrome/Edge/Samsung fire `beforeinstallprompt` very early — usually long
       before the multi-MB Flutter bundle has booted, so a Dart-side listener
       would miss it entirely. This script runs in <head>, captures the event,
       and parks it on `window.__musafirPwa` for the smart sidebar to trigger
       later (see lib/services/pwa/). Calling preventDefault() also suppresses
       Chrome's own mini-infobar so our panel is the single install entry point.
       iOS Safari never fires the event at all, hence the isIos() probe — there
       the UI shows Share ▸ Add to Home Screen instructions instead. -->
  <script>
    (function () {
      var deferred = null;
      var installed = false;

      function announce() {
        window.dispatchEvent(new Event('musafir-pwa-changed'));
      }

      function isStandalone() {
        try {
          if (window.matchMedia) {
            if (window.matchMedia('(display-mode: standalone)').matches) return true;
            if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
            if (window.matchMedia('(display-mode: minimal-ui)').matches) return true;
          }
        } catch (e) {}
        return navigator.standalone === true; // iOS Safari
      }

      function isIosSafari() {
        var ua = navigator.userAgent || '';
        var ios = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // Chrome/Firefox/Edge on iOS can't add to the home screen at all.
        var safari = /WebKit/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|Mercury/.test(ua);
        return ios && safari;
      }

      window.__musafirPwa = {
        canInstall: function () { return !!deferred; },
        isInstalled: function () { return installed || isStandalone(); },
        isIos: function () { return isIosSafari(); },
        // Resolves to 'accepted' | 'dismissed' | 'unavailable'.
        prompt: function () {
          if (!deferred) return Promise.resolve('unavailable');
          var e = deferred;
          deferred = null; // a captured event may only be prompted once
          announce();
          return Promise.resolve(e.prompt())
            .then(function () { return e.userChoice; })
            .then(function (choice) { return (choice && choice.outcome) || 'dismissed'; })
            .catch(function () { return 'unavailable'; });
        }
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        announce();
      });
      window.addEventListener('appinstalled', function () {
        installed = true;
        deferred = null;
        announce();
      });
    })();
  </script>

  <!-- Preload the splash logo so it paints on the very first frame. -->
  <link rel="preload" as="image" href="icons/Icon-192.png?v=4394cb0c">

  <!-- Instant-paint splash. Flutter web renders to a <canvas> only after a
       multi-MB bundle downloads and boots; without this the user (and
       Lighthouse's FCP/LCP timers) stare at a blank white page for seconds.
       This static markup paints immediately and is removed on the engine's
       'flutter-first-frame' event. Inline only — no extra network requests. -->
  <style>
    /* Brand rose, #C35063 — the same value as manifest.json's
       background_color, the Android launch window and the iOS launch screen.
       It was #F6F8F7 with a #0E1F23 dark-mode variant, both derived from the
       old teal identity: on a dark-mode browser the first paint was a dark
       green-teal, and since this background paints the instant the CSS parses
       while the icon is still arriving, that showed as a greenish blank
       window before anything branded appeared.

       There is deliberately no dark-mode override any more. A brand colour
       does not have a dark variant, and the whole point of this element is to
       be the same colour as the four native surfaces above, none of which
       change with the OS theme. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #C35063;
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    #splash.splash--hide { opacity: 0; pointer-events: none; }
    /* No rounding and no shadow: Icon-192's own background is flat #C35063,
       identical to the splash behind it, so what shows is the white mark
       sitting directly on the rose — matching the OS launch screens and the
       Dart SplashScreen that replaces this one. Rounding it would draw a
       visible tile edge around a square that is otherwise invisible. */
    /* 140px so the mark inside it lands at 0.60*140 = 84px wide — the same
       on-screen size as the Dart SplashScreen that replaces this element.
       The two draw different files: Icon-192 carries the mark at 60% of its
       own width, logo.png at 86%, so equal box sizes would NOT give equal
       marks and the handover would visibly jump. */
    #splash img {
      width: 140px;
      height: 140px;
    }
    #splash .splash__spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.28);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    #splash .splash__word {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .splash__spinner { animation: none; }
    }
  </style>

  <!-- Google Maps JavaScript API -->
  <!-- For production: Replace API key during CI/CD build or use environment-specific builds -->
  <!-- `defer`: download in parallel but run AFTER the HTML parses, so these
       never block first paint (the splash). Both are consumed only later, once
       Flutter boots a map or a passkey flow — so deferring is safe. Without it
       these render-blocking <head> scripts delay FCP by seconds on slow mobile. -->
  <!-- `loading=async` tells the Maps loader it may initialise off the critical
       path, which keeps its bootstrap off the main thread during startup.
       Fully lazy-loading (inject on first map) was considered and rejected:
       every map entry point would have to await a loader, and one missed call
       site is a blank map in production. -->
  <script defer src="https://maps.googleapis.com/maps/api/js?loading=async&key=AIzaSyBw1uyOoZ2tS8-NS_83ov8rE3OusmmDWRM"></script>

  <!-- Corbado Passkeys Web SDK (flutter-passkeys 2.4.0) -->
  <script defer src="passkeys_bundle.js"></script>
  <link rel="preload" as="script" href="main.a64c5a3a1988c271.dart.js"></head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png?v=4394cb0c" alt="Musaafir" width="140" height="140">
    <div class="splash__spinner"></div>
    <div class="splash__word">Musaafir</div>
  </div>

  <script>
    // Fade the splash out as soon as Flutter paints its first frame, then
    // remove it so it never intercepts taps. Falls back to the load event in
    // the unlikely case the engine event is missed.
    (function () {
      var removed = false;
      function dismissSplash() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('splash--hide');
        el.addEventListener('transitionend', function () { el.remove(); });
        setTimeout(function () { if (el.parentNode) el.remove(); }, 600);
      }
      window.addEventListener('flutter-first-frame', dismissSplash);
      window.addEventListener('load', function () { setTimeout(dismissSplash, 8000); });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
