name: musafir
description: Musafir rental marketplace for tenants, house owners, and admins.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.3.3
  google_maps_flutter: ^2.6.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  web: ^1.1.0
  webview_flutter: ^4.7.0
  crypto: ^3.0.3
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  sms_autofill: ^2.4.0
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  mime: ^1.0.5
  path: ^1.9.0
  # Image compression (upload) + disk-cached display
  flutter_image_compress: ^2.3.0
  image: ^4.2.0
  cached_network_image: ^3.4.1
  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
